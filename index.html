<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>N-Back — Phaser 3 (CDN)</title>
<style>
  html, body { height: 100%; margin: 0; background: #05070f; color: #d9e2f4;
    font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
    overscroll-behavior: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    user-select: none; touch-action: none; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; }
  #hdr  { order: 1; text-align: center; }
  #stage { order: 2; display: flex; justify-content: center; }
  #foot { order: 3; text-align: center; font-size: 12px; opacity: .6; margin-top: 12px; }
  #loaderr { order: 2; font-size: 15px; color: #ff8b8b; padding: 12px; }
  #hdr h1 { font-size: 24px; letter-spacing: 4px; margin: 8px 0 2px; color: #7ee6d0; }
  #hdr div { font-size: 13px; opacity: .75; }
  canvas { display: block; width: min(96vw, 53.1vh) !important; height: auto !important;
    max-width: 96vw; max-height: 92vh; touch-action: none; -webkit-tap-highlight-color: transparent;
    box-shadow: 0 18px 44px rgba(0,0,0,.6); }
  /* The stage is phone-shaped (portrait), so it fills a phone screen as-is. */
  @media (orientation: portrait) and (max-width: 760px) {
    #hdr h1 { font-size: 19px; letter-spacing: 2px; margin: 4px 0 0; }
    #hdr div { font-size: 11px; }
    #foot { font-size: 11px; margin-top: 6px; }
  }
  @media (orientation: landscape) and (max-height: 760px) {
    #hdr h1 { font-size: 19px; letter-spacing: 2px; margin: 4px 0 0; }
    #hdr div { font-size: 11px; }
    #foot { font-size: 11px; margin-top: 6px; }
    #foot::after { content: ' · rotate to portrait: the stage is phone-shaped'; }
  }
</style>

<!-- Phaser 3 from CDN (single global: window.Phaser) -->
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
</head>
<body>
  <div id="hdr"><h1>N-BACK</h1><div>Phaser 3 · one HTML file · zero assets (art + audio generated at runtime)</div></div>
  <div id="stage"></div>
  <div id="foot">Phaser 3.80.1 from jsDelivr (unpkg fallback) · keyboard + mouse or touch · Web Audio formant synth</div>
  <div id="loaderr"></div>

  <script>
  (function boot () {
  'use strict';

  /* ============================================================
     0. PHASER BOOTSTRAP — CDN with fallback + graceful failure
     ============================================================ */
  var CDN_PRIMARY  = 'https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js';
  var CDN_FALLBACK = 'https://unpkg.com/phaser@3.80.1/dist/phaser.min.js';

  function showLoadError(msg) {
    var el = document.getElementById('loaderr');
    if (el) el.textContent = msg;
  }

  /* If the primary CDN was blocked, load the fallback and re-run boot() from
     its onload. We must return before the `class ... extends Phaser.Scene`
     declaration below is evaluated (it would throw with Phaser undefined), so
     the whole game - class included - is instantiated on the second boot(). */
  if (!window.Phaser) {
    showLoadError('Primary Phaser CDN blocked — retrying from unpkg…');
    var fb = document.createElement('script');
    fb.src = CDN_FALLBACK;
    fb.onload = function () {
      if (window.Phaser) { showLoadError(''); boot(); }
      else { showLoadError('Phaser script loaded but the Phaser global is missing.'); }
    };
    fb.onerror = function () {
      showLoadError('Could not load Phaser from any CDN — check your connection or ad-blocker.');
    };
    document.head.appendChild(fb);
    return;
  }

  /* Hoisted: safe to reference from the bootstrap block above. */
  function startGame() {
    new Phaser.Game({
      type: Phaser.AUTO,
      width: GW, height: GH,
      background: '#0a0f1e',
      parent: document.getElementById('stage'),
      scene: NBackScene
    });
  }

  /* ============================================================
     1. AUDIO — procedural "Duhfeldt" style formant sounds
        (no asset files: everything is synthesised with Web Audio)
     ============================================================ */
  var AC = null, MASTER = null, NOISE = null, SOUND_ON = true;
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    MASTER = AC.createGain();
    MASTER.gain.value = 0.75;
    MASTER.connect(AC.destination);
  } catch (e) { AC = null; MASTER = null; }

  function noiseBuf() {
    if (!AC) return null;
    if (NOISE) return NOISE;
    var n = Math.floor(AC.sampleRate * 0.5);
    NOISE = AC.createBuffer(1, n, AC.sampleRate);
    var d = NOISE.getChannelData(0);
    for (var i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    return NOISE;
  }

  function env(g, t0, dur, peak, attack, release) {
    var a = Math.min(attack, dur * 0.4);
    var r = Math.min(release, dur * 0.6);
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(peak, t0 + a);
    g.gain.setValueAtTime(peak, t0 + dur - r);
    g.gain.linearRampToValueAtTime(0, t0 + dur);
  }

  function tone(freq, t0, dur, peak, type) {
    if (!AC) return;
    var o = AC.createOscillator();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t0);
    var g = AC.createGain();
    env(g, t0, dur, peak, 0.012, 0.05);
    o.connect(g); g.connect(MASTER);
    o.start(t0); o.stop(t0 + dur + 0.02);
  }

  /* A synthetic vowel = formant peaks (+ a voiced fundamental for body). */
  function vowel(t0, dur, f, voiced) {
    var spec = [[f[0], 1.00], [f[1], 0.42], [f[2], 0.16]];
    if (voiced) { spec.push([110, 0.50]); spec.push([220, 0.22]); }
    for (var i = 0; i < spec.length; i++) tone(spec[i][0], t0, dur, spec[i][1] * 0.16, 'sine');
  }

  /* Fricatives (s, f, sh) = noise + high-frequency sibilance boost. */
  function fric(t0, dur, f, peak) {
    var buf = noiseBuf();
    if (!buf) return;
    var src = AC.createBufferSource();
    src.buffer = buf; src.loop = true; src.offset = Math.random() * 0.4;
    var g = AC.createGain();
    env(g, t0, dur, peak, 0.02, 0.05);
    src.connect(g); g.connect(MASTER);
    src.start(t0); src.stop(t0 + dur + 0.02);
    tone(f[0], t0, dur, peak * 0.45, 'sine');
    tone(f[1], t0, dur, peak * 0.22, 'sine');
  }

  /* Plosive burst (b / d / t). */
  function plosive(t0, d, voiced) {
    var buf = noiseBuf();
    if (!buf) return;
    var src = AC.createBufferSource();
    src.buffer = buf; src.offset = Math.random() * 0.4;
    var g = AC.createGain();
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(voiced ? 0.5 : 0.34, t0 + 0.006);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + d + 0.04);
    src.connect(g); g.connect(MASTER);
    src.start(t0); src.stop(t0 + d + 0.06);
    if (voiced) tone(120, t0, d + 0.04, 0.22, 'sine');
  }

  /* The classic 7-letter Duhfeldt set, spelled out as sound segments. */
  var LETTER_SND = {
    'E': [{ k: 'v', f: [240, 2250, 3150], d: 0.34 }],
    'B': [{ k: 'p', d: 0.05, v: true },  { k: 'v', f: [250, 2300, 3200], d: 0.26 }],
    'D': [{ k: 'p', d: 0.04, v: false }, { k: 'v', f: [250, 2300, 3200], d: 0.26 }],
    'C': [{ k: 's', f: [4200, 6200], d: 0.16 }, { k: 'v', f: [250, 2300, 3200], d: 0.24 }],
    'F': [{ k: 'v', f: [640, 1900, 2900], d: 0.16 }, { k: 's', f: [3200, 4300], d: 0.18 }],
    'A': [{ k: 'v', f: [620, 1550, 2850], d: 0.14 }, { k: 'v', f: [330, 2250, 3100], d: 0.18 }],
    'H': [{ k: 'v', f: [620, 1550, 2850], d: 0.12 }, { k: 'v', f: [330, 2250, 3100], d: 0.12 },
          { k: 'p', d: 0.03 }, { k: 's', f: [3600, 5200], d: 0.14 }]
  };

  function playLetter(L) {
    if (!AC || !SOUND_ON) return;
    var segs = LETTER_SND[L], t = AC.currentTime + 0.01;
    for (var i = 0; i < segs.length; i++) {
      var s = segs[i];
      if (s.k === 'v') vowel(t, s.d, s.f, true);
      else if (s.k === 's') fric(t, s.d, s.f, 0.30);
      else plosive(t, s.d, s.v);
      t += s.d;
    }
  }

  /* Position sound: pitch encodes the row, timbre encodes the column. */
  function playPosition(idx) {
    if (!AC || !SOUND_ON) return;
    var row = Math.floor(idx / 3), col = idx % 3;
    var base = 165 * Math.pow(2, row * 3 / 12);
    var ratio = [1, 1.5, 2][col];
    var t = AC.currentTime + 0.01;
    tone(base, t, 0.34, 0.30, 'sine');
    tone(base * ratio, t, 0.34, 0.12 + col * 0.05, 'sine');
    tone(base * 2.6, t, 0.30, 0.05 + col * 0.03, 'triangle');
  }

  function sfxGood() { if (!AC || !SOUND_ON) return; var t = AC.currentTime; tone(660, t, 0.10, 0.22); tone(990, t + 0.07, 0.12, 0.18); }
  function sfxBad()  { if (!AC || !SOUND_ON) return; var t = AC.currentTime; tone(300, t, 0.16, 0.22, 'sawtooth'); tone(180, t + 0.09, 0.18, 0.20, 'sawtooth'); }
  function sfxBlip() { if (!AC || !SOUND_ON) return; tone(520, AC.currentTime, 0.06, 0.16); }
  function sfxStart(){ if (!AC || !SOUND_ON) return; var t = AC.currentTime; tone(440, t, 0.09, 0.2); tone(660, t + 0.08, 0.09, 0.2); tone(880, t + 0.16, 0.14, 0.22); }

  /* ============================================================
     2. GAME CONSTANTS + PURE LOGIC
     ============================================================ */
  var GW = 600, GH = 1040;   /* portrait phone stage (the game targets phones) */
  /* Touch screen? Phones and tablets have no keyboard, so every key-only action
     gets a tap target and the setup pickers grow to thumb size. Decided once. */
  var TOUCH = !!((typeof navigator === 'object' && (navigator.maxTouchPoints || 0) > 0) ||
              ('ontouchstart' in window) ||
              (window.matchMedia && window.matchMedia('(pointer: coarse)').matches));
  var PAD = TOUCH ? 6 : 0;   /* extra hit margin (game pixels) around tap targets */
  var COLS = 3, ROWS = 3, NPOS = COLS * ROWS;
  var LETTERS = ['E', 'H', 'A', 'D', 'F', 'B', 'C'];
  var SPEEDS = [{ name: 'Slow', ms: 2600 }, { name: 'Normal', ms: 1900 }, { name: 'Fast', ms: 1400 }];
  var LENGTHS = [12, 20, 28];
  var MODES = [
    { key: 'letters',   label: 'LETTERS',   dims: ['letter'],        desc: 'watch + listen to letters' },
    { key: 'positions', label: 'POSITIONS', dims: ['pos'],           desc: 'watch + listen to the grid' },
    { key: 'dual',      label: 'DUAL',      dims: ['letter', 'pos'], desc: 'letters AND grid at once' }
  ];
  var DIM_LABEL = { letter: 'LETTER', pos: 'POSITION' };

  var G = {
    state: 'setup',
    n: 2, mode: 2, speed: 1, len: 1,
    score: 0, best: 0, lives: 3, streak: 0,
    hint: false, paused: false, pauseElapsed: 0,
    autoLevel: true,
    round: null, msg: '', msg2: '',
    totals: { hit: 0, miss: 0, fa: 0, cr: 0 }
  };

  /* ---- settings API: one place to change N and the channel -------------- */
  var N_MIN = 1, N_MAX = 4;

  /* Every spelling of the three channel choices the system accepts. */
  var CHANNEL_ALIASES = {
    'letter': 'letters', 'letters': 'letters', 'l': 'letters', 'lt': 'letters',
    'letter only': 'letters', 'letters only': 'letters',
    'pos': 'positions', 'position': 'positions', 'positions': 'positions',
    'p': 'positions', 'ps': 'positions', 'grid': 'positions',
    'position only': 'positions', 'positions only': 'positions',
    'both': 'dual', 'dual': 'dual', 'b': 'dual', 'all': 'dual',
    'letter+pos': 'dual', 'letter,pos': 'dual', 'letters+positions': 'dual'
  };

  function toNumber(value) {
    if (typeof value === 'number') return value;
    if (typeof value === 'string') {
      var s = value.trim();
      if (!s) return NaN;
      return Number(s);
    }
    return NaN;
  }

  function clampNum(value, lo, hi) {
    var v = toNumber(value);
    if (isNaN(v)) return null;
    v = Math.round(v);
    return v < lo ? lo : (v > hi ? hi : v);
  }

  function modeIndexOf(key) {
    for (var i = 0; i < MODES.length; i++) if (MODES[i].key === key) return i;
    return -1;
  }

  /* 'letter' | 'pos' | 'both' (plus aliases) -> index into MODES, -1 = no change. */
  function channelToMode(value) {
    if (value === null || value === undefined || value === false) return -1;
    if (typeof value === 'number') {
      var n = Math.round(value);
      return (n >= 0 && n < MODES.length) ? n : -1;
    }
    var s = String(value).trim().toLowerCase();
    if (CHANNEL_ALIASES[s] !== undefined) return modeIndexOf(CHANNEL_ALIASES[s]);
    var idx = clampNum(s, 0, MODES.length - 1);
    return (idx !== null && String(idx) === s) ? idx : -1;
  }

  function speedIndexOf(value) {
    if (typeof value === 'number') {
      var n = Math.round(value);
      return (n >= 0 && n < SPEEDS.length) ? n : -1;
    }
    var s = String(value).trim().toLowerCase();
    for (var i = 0; i < SPEEDS.length; i++) {
      if (SPEEDS[i].name.toLowerCase() === s) return i;
      if (String(SPEEDS[i].ms) === s) return i;
    }
    var idx = clampNum(s, 0, SPEEDS.length - 1);
    return (idx !== null && String(idx) === s) ? idx : -1;
  }

  function lengthIndexOf(value) {
    if (typeof value === 'number') {
      for (var i = 0; i < LENGTHS.length; i++) if (LENGTHS[i] === Math.round(value)) return i;
      var n = Math.round(value);
      return (n >= 0 && n < LENGTHS.length) ? n : -1;
    }
    var s = String(value).trim().toLowerCase();
    for (var j = 0; j < LENGTHS.length; j++) if (String(LENGTHS[j]) === s) return j;
    var idx = clampNum(s, 0, LENGTHS.length - 1);
    return (idx !== null && String(idx) === s) ? idx : -1;
  }

  /* Pick the channel by dims array (used when a round hands back its dims). */
  function dimsToMode(dims) {
    if (!dims || !dims.length) return -1;
    for (var i = 0; i < MODES.length; i++) {
      var ref = MODES[i].dims;
      if (ref.length !== dims.length) continue;
      var same = true;
      for (var d = 0; d < dims.length; d++) if (ref[d] !== dims[d]) { same = false; break; }
      if (same) return i;
    }
    return -1;
  }


  /* Explicit choices: setting N by hand pins it, so auto-leveling stops moving it. */
  function setN(value) {
    var n = clampNum(value, N_MIN, N_MAX);
    if (n === null) return G.n;
    G.n = n;
    G.autoLevel = false;
    return G.n;
  }

  function setChannel(value) {
    var idx = channelToMode(value);
    if (idx < 0) return -1;
    G.mode = idx;
    return G.mode;
  }

  function setSpeed(value) {
    var idx = speedIndexOf(value);
    if (idx < 0) return -1;
    G.speed = idx;
    return G.speed;
  }

  function setLength(value) {
    var idx = lengthIndexOf(value);
    if (idx < 0) return -1;
    G.len = idx;
    return G.len;
  }

  function setAutoLevel(flag) {
    if (flag === null || flag === undefined) return G.autoLevel;
    if (typeof flag === 'string') {
      var s = flag.trim().toLowerCase();
      G.autoLevel = !(s === '' || s === 'false' || s === 'off' || s === 'no' || s === '0');
    } else {
      G.autoLevel = !!flag;
    }
    return G.autoLevel;
  }

  /* Cycling keys keep auto-leveling alive; only explicit picks pin it. */
  function cycleN() { G.n = G.n % N_MAX + N_MIN; return G.n; }
  function cycleMode() { G.mode = (G.mode + 1) % MODES.length; return G.mode; }

  /* The single entry point for difficulty/settings changes:
     setGameOptions(3, 'both')
     setGameOptions(2, 'letter', 'fast', 20)
     setGameOptions({ n: 1, channel: 'pos', speed: 'slow', len: 12, autoLevel: true })
     Pass null / undefined / '' to leave a slot untouched. Returns the new state. */
  function setGameOptions(a, b, c, d, e) {
    if (a !== null && typeof a === 'object') {
      var o = a;
      if (o.n !== undefined) setN(o.n);
      if (o.channel !== undefined) setChannel(o.channel);
      else if (o.mode !== undefined) setChannel(o.mode);
      if (o.dims !== undefined) setChannel(o.dims);
      if (o.speed !== undefined) setSpeed(o.speed);
      if (o.len !== undefined) setLength(o.len);
      else if (o.length !== undefined) setLength(o.length);
      if (o.autoLevel !== undefined) setAutoLevel(o.autoLevel);
      return stateSnapshot();
    }
    if (a !== null && a !== undefined && a !== '') setN(a);
    if (b !== null && b !== undefined && b !== '') setChannel(b);
    if (c !== null && c !== undefined && c !== '') setSpeed(c);
    if (d !== null && d !== undefined && d !== '') setLength(d);
    if (e !== null && e !== undefined) setAutoLevel(e);
    return stateSnapshot();
  }

  function stateSnapshot() {
    var running = (G.round && (G.state === 'play' || G.state === 'countdown'));
    return {
      n: G.n,
      mode: G.mode,
      modeKey: MODES[G.mode].key,
      modeLabel: MODES[G.mode].label,
      channel: MODES[G.mode].key,
      dims: MODES[G.mode].dims.slice(),
      speed: SPEEDS[G.speed].name,
      speedMs: SPEEDS[G.speed].ms,
      len: LENGTHS[G.len],
      autoLevel: G.autoLevel,
      appliesTo: running ? 'next round' : 'immediately'
    };
  }

  /* The dims the player can actually press right now. A started round keeps its
     own dims so a settings change made mid-round cannot desync the judging. */
  function activeDims() {
    var R = G.round;
    if (R && (G.state === 'play' || G.state === 'countdown')) return R.dims;
    return MODES[G.mode].dims;
  }

  function activeMode() {
    var R = G.round;
    if (R && (G.state === 'play' || G.state === 'countdown') && R.modeIndex !== undefined) return MODES[R.modeIndex];
    return MODES[G.mode];
  }


  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function pickFrom(pool, forbidden) {
    var ok = [];
    for (var i = 0; i < pool.length; i++) if (pool[i] !== forbidden) ok.push(pool[i]);
    if (!ok.length) ok = pool;
    return ok[Math.floor(Math.random() * ok.length)];
  }

  /* Build a sequence with a controlled number of real matches per dimension. */
  function buildSequence(n, len, dims) {
    var judgeable = len - n;
    var target = Math.max(1, Math.round(judgeable * 0.25));
    var force = {};
    for (var d = 0; d < dims.length; d++) {
      var idxs = [];
      for (var k = n; k < len; k++) idxs.push(k);
      shuffle(idxs);
      var set = {};
      for (var m = 0; m < Math.min(target, idxs.length); m++) set[idxs[m]] = true;
      force[dims[d]] = set;
    }
    var items = [];
    for (var i = 0; i < len; i++) {
      var prev = (i - n >= 0) ? items[i - n] : null;
      var it = { letter: null, pos: -1 };
      for (var q = 0; q < dims.length; q++) {
        var dim = dims[q];
        if (dim === 'letter') {
          it.letter = (prev && force.letter && force.letter[i]) ? prev.letter
                     : pickFrom(LETTERS, prev ? prev.letter : null);
        } else {
          it.pos = (prev && force.pos && force.pos[i]) ? prev.pos
                  : pickFrom([0, 1, 2, 3, 4, 5, 6, 7, 8], prev ? prev.pos : -99);
        }
      }
      items.push(it);
    }
    return items;
  }


  /* ---- round lifecycle ---------------------------------------------------- */
  function newRound() {
    var mode = MODES[G.mode];
    var len = LENGTHS[G.len];
    G.round = {
      n: G.n,
      modeIndex: G.mode,
      dims: mode.dims,
      items: buildSequence(G.n, len, mode.dims),
      i: -1,
      pressed: {},
      itemStart: 0,
      speed: SPEEDS[G.speed].ms,
      hit: 0, miss: 0, fa: 0, cr: 0,
      points: 0
    };
    G.state = 'countdown';
    G.cdStart = 0; G.cdNum = 3; G.cdBeeps = 0;
    G.roundNo = (G.roundNo || 0) + 1;
    G.msg = '';
  }

  function startItem(i) {
    var R = G.round;
    R.i = i;
    R.pressed = {};
    R.itemStart = NOW();
    var it = R.items[i];
    /* Dual mode overlaps both channels, exactly like the classic game. */
    if (indexOf(R.dims, 'pos') >= 0) playPosition(it.pos);
    if (indexOf(R.dims, 'letter') >= 0) playLetter(it.letter);
  }

  function judgeDim(dim, i) {
    var R = G.round;
    if (i < R.n) return null;                 /* nothing to compare yet */
    var cur = R.items[i], prev = R.items[i - R.n];
    var expected = (dim === 'letter') ? (cur.letter === prev.letter) : (cur.pos === prev.pos);
    var pressed = !!R.pressed[dim];
    if (expected && pressed) return 'hit';
    if (expected && !pressed) return 'miss';
    if (!expected && pressed) return 'fa';
    return 'cr';
  }

  function applyResult(dim, res, i) {
    var R = G.round, pts = 0, label = '';
    if (res === 'hit') {
      G.streak++;
      pts = 100 + Math.min(G.streak, 10) * 15;
      R.hit++; G.totals.hit++; label = '+' + pts + ' HIT';
      sfxGood(); flash(0x39e4c8, 220);
    } else if (res === 'cr') {
      G.streak++;
      pts = 10;
      R.cr++; G.totals.cr++; label = '+' + pts + ' OK';
    } else if (res === 'miss') {
      G.streak = 0; G.lives--;
      pts = -100;
      R.miss++; G.totals.miss++; label = '-100 MISS';
      sfxBad(); flash(0xff4f6b, 320);
    } else {
      G.streak = 0; G.lives--;
      pts = -50;
      R.fa++; G.totals.fa++; label = '-50 FALSE ALARM';
      sfxBad(); flash(0xff4f6b, 320);
    }
    G.score += pts; R.points += pts;

  var HTX = LBOX.x + LBOX.w / 2, HTY = LBOX.y + LBOX.h - 24;

  class NBackScene extends Phaser.Scene {

    /* ---------- build: create persistent display objects ---------- */

      };

         row 1  N (left) · channel (centre) · SCORE (right)

         row 3  the stats line (centre, full width) */
      this.tN = this.add.text(16, 42, '', st(30, '#ffffff')).setOrigin(0, 0.5);
      this.tMode = this.add.text(CX, 42, '', st(20, '#7ee6d0')).setOrigin(0.5, 0.5);
      this.tScore = this.add.text(GW - 16, 42, '', st(20, '#ffd98a')).setOrigin(1, 0.5);
      this.tSub = this.add.text(CX, 78, '', st(15, '#9fb2d4')).setOrigin(0.5, 0.5);
      this.tBest = this.add.text(GW - 16, 78, '', st(15, '#9fb2d4')).setOrigin(1, 0.5);
      this.tStat = this.add.text(CX, 112, '', st(15, '#9fb2d4')).setOrigin(0.5, 0.5);

      this.btnLabel = {
        letter: this.add.text(BTN.letter.x + BTN.letter.w / 2, BTN.letter.y + BTN.letter.h / 2, '', st(18, '#ffffff')).setOrigin(0.5, 0.5),
        pos: this.add.text(BTN.pos.x + BTN.pos.w / 2, BTN.pos.y + BTN.pos.h / 2, '', st(18, '#ffffff')).setOrigin(0.5, 0.5)
      };
      this.btnLabel.letter.alpha = 0; this.btnLabel.pos.alpha = 0;
      /* The legend only shows on the setup screen, under the START button. */
      this.tLegend = this.add.text(CX, 850, '', st(14, '#7488ab')).setOrigin(0.5, 0.5);

      this.tBig = this.add.text(CX, 190, '', st(40, '#ffffff')).setOrigin(0.5, 0.5);

      this.tLetter = this.add.text(LTX, LTY, '', st(52, '#ffd98a')).setOrigin(0.5, 0.5);
      this.tHintL = this.add.text(HTX, HTY, '', st(18, '#7ee6d0')).setOrigin(0.5, 0.5);

      this.nLabels = [];

      var y = (e.clientY - r.top) * (GH / r.height);

    /* ---------- static background, painted once ---------- */
    paintBackground() {

      g.fillRect(0, 0, GW, GH);

        g.fillStyle(0x111a30, 0.45);
        g.fillRect(0, 120 + i * 112, GW, 2);
      }

      g.fillStyle(0x0d1526, 0.94);
      g.fillRect(0, 0, GW, 140);
      g.fillStyle(0x0d1526, 0.94);
      g.fillRect(0, GH - 162, GW, 162);
      g.lineStyle(1, 0x24344f, 1);
      g.lineBetween(0, 140, GW, 140);

      if (st === 'setup' || st === 'results' || st === 'gameover') this.drawPanelScreen();
      if (st === 'setup') this.drawSetupOptions();

    /* ---------- stage drawing ---------- */

            g.strokeRoundedRect(x, y, CELL, CELL, 18);

            g.fillRoundedRect(x, y, CELL, CELL, 18);

      p.fillRoundedRect(LBOX.x, LBOX.y, LBOX.w, LBOX.h, 14);
      p.lineStyle(2.5, 0xffc86a, 0.95);

        if (!enabled) { this.btnLabel[dim].alpha = 0; continue; }
        var pressed = R && R.pressed[dim];
        this.btnG.fillStyle(pressed ? 0xffc86a : 0x1b2740, pressed ? 0.92 : 0.85);
        this.btnG.fillRoundedRect(b.x, b.y, b.w, b.h, 14);
        this.btnG.lineStyle(2, pressed ? 0xffffff : 0x3f5a86, 1);
        this.btnG.strokeRoundedRect(b.x, b.y, b.w, b.h, 14);
        var base = (dim === 'letter' ? 'MATCH LETTER' : 'MATCH POSITION');
        /* The strips are 72px tall, so the pressed state sits on its own line
           under the label instead of squeezing beside it. */
        this.btnLabel[dim].setText(base + (pressed ? '\npressed' : ''));
        this.btnLabel[dim].alpha = 1;
      }
    }

    /* Touch-only: tap targets for the actions that normally need a key. */

      if (!TBAR.length) return;

        var r = TBAR[b];

        g.fillRoundedRect(r.x, r.y, r.w, r.h, 10);
        g.lineStyle(2, on ? 0xffffff : 0x3f5a86, 1);
        g.strokeRoundedRect(r.x, r.y, r.w, r.h, 10);
        this.barLabels[b].setText(TBAR_LABELS[b]);
        this.barLabels[b].setColor(on ? '#0a0f1e' : '#c6d5f0');
        this.barLabels[b].alpha = 1;

      p.lineStyle(2, 0x2f4a6a, 1);
      p.strokeRoundedRect(PANEL.x, PANEL.y, PANEL.w, PANEL.h, 18);

        p.lineStyle(2, 0x7488ab, 1);
        p.strokeRoundedRect(e.x, e.y, e.w, e.h, 12);

    /* ---------- setup screen: N + channel pickers ---------- */

      for (var i = 0; i < N_BTNS.length; i++) {

        p.fillStyle(sel ? 0x2ee6c6 : 0x1b2740, sel ? 0.92 : 0.85);
        p.fillRoundedRect(b.x, b.y, b.w, b.h, 10);
        p.lineStyle(2, sel ? 0xffffff : 0x3f5a86, 1);
        p.strokeRoundedRect(b.x, b.y, b.w, b.h, 10);
        this.nLabels[i].setText('N = ' + (i + N_MIN));
        this.nLabels[i].setColor(sel ? '#0a0f1e' : '#ffffff');
        this.nLabels[i].alpha = 1;
      }

        var c = CH_BTNS[j], sel2 = (j === G.mode);
        p.fillStyle(sel2 ? 0xffc86a : 0x1b2740, sel2 ? 0.92 : 0.85);
        p.fillRoundedRect(c.x, c.y, c.w, c.h, 10);
        p.lineStyle(2, sel2 ? 0xffffff : 0x3f5a86, 1);
        p.strokeRoundedRect(c.x, c.y, c.w, c.h, 10);
        this.chLabels[j].setText(MODES[j].label);
        this.chLabels[j].setColor(sel2 ? '#0a0f1e' : '#c6d5f0');
        this.chLabels[j].alpha = 1;
      }
      this.tCapN.setText(TOUCH ? 'N-BACK COUNT' : 'N-BACK COUNT   keys 1-4');
      this.tCapN.alpha = 1;
      this.tCapCh.setText(TOUCH ? 'CHANNEL' : 'CHANNEL   keys L / P / B');
      this.tCapCh.alpha = 1;

    /* ---------- HUD drawing ---------- */
    drawHud(now) {
      var g = this.hudG;
      var R = G.round;
      /* progress bar: a full-width strip at the very top of the HUD band */
      var bx = 60, bw = 480, by = 8, bh = 8;
      g.fillStyle(0x1a2438, 1);
      g.fillRoundedRect(bx, by, bw, bh, 6);
      if (R && R.items.length && R.i >= 0) {
        var frac = (R.i + 1) / R.items.length;
        g.fillStyle(0x2ee6c6, 0.9);
        g.fillRoundedRect(bx, by, Math.max(6, bw * frac), bh, 6);
      }
      /* lives (hearts) — left end of the second HUD row */
      for (var i = 0; i < 3; i++) {
        var x = 30 + i * 34, y = 78;
        if (i < G.lives) g.fillStyle(0xff5a72, 1); else g.fillStyle(0x243048, 1);
        g.fillCircle(x - 6, y - 3, 7);
        g.fillCircle(x + 6, y - 3, 7);
        g.beginPath();
        g.moveTo(x - 12, y - 4);
        g.lineTo(x + 12, y - 4);
        g.lineTo(x, y + 12);
        g.closePath();
        g.fillPath();
      }
    }

    drawFlash(now) {
      if (now >= flashState.until) return;
      var a = (flashState.until - now) / 320;
      this.flashG.fillStyle(flashState.color, Math.min(0.35, a * 0.35));
      this.flashG.fillRect(0, 0, GW, GH);
    }

    /* ---------- text sync (HUD + screens) ---------- */
    syncTexts(now) {
      var st = G.state;
      var mode = activeMode();
      var R0 = G.round;
      var running = (R0 && (st === 'play' || st === 'countdown'));
      var nShown = running ? R0.n : G.n;
      this.tN.setText('N = ' + nShown);
      this.tMode.setText(mode.label);
      this.tScore.setText('SCORE ' + G.score);
      this.tBest.setText('BEST ' + G.best);
      /* Row 2 only has room for a short centre label, so it carries the round
         pace; hints + sound live in the stats line and on the action bar. */
      this.tSub.setText(SPEEDS[G.speed].name + ' · ' + LENGTHS[G.len] + ' items' +
        (TOUCH ? '' : ' · auto-level ' + (G.autoLevel ? 'ON' : 'OFF')));
      var R = G.round;
      var judged = R ? (R.hit + R.miss + R.fa + R.cr) : 0;
      var acc = judged ? Math.round((R.hit + R.cr) / judged * 100) : 0;
      this.tStat.setText('streak ' + G.streak + ' · acc ' + acc + '% · hints ' +
        (G.hint ? 'ON' : 'OFF') + ' · sound ' + (SOUND_ON ? 'ON' : 'OFF'));
      /* The legend only appears on the setup screen, under the START button,
         so it can use the full stage width without colliding with the play
         stack (grid -> match strips -> action bar). */
      this.tLegend.setText(TOUCH
        ? 'TAP the N + CHANNEL buttons, then tap START'
        : 'KEYS  1-4 N · L/P/B channel · S speed · V length · H hints');
      this.tLegend.alpha = (st === 'setup') ? 1 : 0;
      /* On the play screen the letter panel + strips own the top and bottom of
         the stage, so the only clear spot for the PAUSED banner is the middle
         of the grid (which is frozen while the round is paused). */
      this.tBig.y = (st === 'play') ? CY : 190;

      this.tStart.alpha = (st === 'setup' || st === 'results' || st === 'gameover') ? 1 : 0;
      /* The N + channel pickers belong to the setup screen only: once a round
         starts their labels fade out (the keys still re-pick between rounds). */
      if (st !== 'setup') {
        for (var oi = 0; oi < this.nLabels.length; oi++) this.nLabels[oi].alpha = 0;
        for (var oj = 0; oj < this.chLabels.length; oj++) this.chLabels[oj].alpha = 0;
        this.tCapN.alpha = 0; this.tCapCh.alpha = 0;
      }
      /* The action bar belongs to the play state; the tap-to-setup chip to the
         results / game-over screens. */
      if (st !== 'play') {
        for (var ob = 0; ob < this.barLabels.length; ob++) this.barLabels[ob].alpha = 0;
      }
      this.tExit.alpha = (st === 'results' || st === 'gameover') ? 1 : 0;
      /* The setup screen packs the rules + two picker rows + START, so its
         rules block sits higher than on the results / game-over screens. */
      this.tBody.y = (st === 'setup') ? 370 : 440;

      if (st === 'setup') {
        this.tBig.setText('SETUP');
        this.tBig.alpha = 1;
        this.tBody.setText(TOUCH ? RULES_TOUCH : RULES);
        this.tBody.alpha = 1;
        this.tCd.alpha = 0;
      } else if (st === 'countdown') {
        this.tBig.setText('GET READY');
        this.tBig.alpha = 1;
        this.tCd.setText(String(G.cdNum));
        this.tCd.alpha = 1;
        this.tBody.alpha = 0;
      } else if (st === 'play') {
        this.tBody.alpha = 0;
        this.tCd.alpha = 0;
        if (G.paused) {
          this.tBig.setText(TOUCH ? 'PAUSED  (tap PAUSE to resume)' : 'PAUSED  (P to resume)');
          this.tBig.alpha = 1;
        } else {
          this.tBig.alpha = 0;
        }
      } else if (st === 'results') {
        var R2 = G.round;
        var j = R2.hit + R2.miss + R2.fa + R2.cr;
        var a2 = j ? Math.round((R2.hit + R2.cr) / j * 100) : 0;
        this.tBig.setText('ROUND ' + G.roundNo + ' COMPLETE');
        this.tBig.alpha = 1;
        this.tCd.alpha = 0;
        this.tBody.setText(
          'hits ' + R2.hit + '   misses ' + R2.miss + '   false alarms ' + R2.fa +
          '   correct rejections ' + R2.cr +
          '\naccuracy ' + a2 + '%   round points ' + R2.points + '   total score ' + G.score +
          '\n\n' + G.msg +
          (TOUCH ? '\n\nTap START = next round   Tap SETUP = change settings'
                : '\n\nSPACE = next round      R = back to setup')
        );
        this.tBody.alpha = 1;
      } else if (st === 'gameover') {
        this.tBig.setText('GAME OVER');
        this.tBig.alpha = 1;
        this.tCd.alpha = 0;
        this.tBody.setText(
          'Out of lives.\n\nscore ' + G.score + '   best ' + G.best +
          '\ntotal hits ' + G.totals.hit + '   misses ' + G.totals.miss +
          '   false alarms ' + G.totals.fa +
          (TOUCH ? '\n\nTap START to play again' : '\n\nSPACE = play again')
        );
        this.tBody.alpha = 1;
      }
    }

    /* ---------- floating score popups ---------- */
    popText(dim, label, pts) {
      var b = BTN[dim] || BTN.letter;
      var x = b.x + b.w / 2, y = b.y - 26;
      var t = this.add.text(x, y, label, {
        fontSize: TOUCH ? 26 : 22, fontFamily: FONT, fontStyle: 'bold', align: 'center',
        color: pts > 0 ? '#5df3cf' : '#ff6b81'
      }).setOrigin(0.5, 0.5);
      this.tweens.add({ targets: t, y: y - 60, alpha: 0, duration: 900, ease: 'quint.out' });
      this.pops.push({ t: t, born: NOW() });
    }

    cleanupPops(now) {
      for (var i = this.pops.length - 1; i >= 0; i--) {
        if (now - this.pops[i].born > 1400) {
          this.pops[i].t.destroy();
          this.pops.splice(i, 1);
        }
      }
    }
  }

  /* ============================================================
     4. INPUT / STATE TRANSITIONS (framework independent)
     ============================================================ */
  /* Rules are wrapped to the 520px text box on the 600px phone stage, so every
     line is kept short enough to stay on one rendered line. */
  var RULES =
    'HOW TO PLAY\n' +
    'Items are shown and spoken one at a time. Press MATCH when\n' +
    'the current item equals the item N steps earlier; do not\n' +
    'press when it differs. DUAL judges both channels.\n\n' +
    'SCORING  hit +100  reject +10  miss -100  false alarm -50\n\n' +
    'SETUP  1-4 = N  L letters  P positions  B both  S speed\n' +
    'V length  H hints  T sound  Esc setup\n\n' +
    'Tap or click the N + channel buttons below,\n' +
    'then press SPACE.';

  /* Shorter wording for phones: tap verbs instead of key names. */
  var RULES_TOUCH =
    'HOW TO PLAY\n' +
    'Tap the MATCH strips, the letter panel,\n' +
    'the grid or the letter when the current\n' +
    'item equals the one N steps back.\n' +
    'Do not tap when it differs.\n\n' +
    'hit +100  reject +10  miss -100\n' +
    'false alarm -50  3 lives\n' +
    'Tap the N + CHANNEL buttons, then\n' +
    'tap START.';

  function inRect(x, y, r) {
    return x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;
  }

  /* Same test with the touch margin added, so thumbs need no pixel accuracy. */
  function inRectPad(x, y, r) {
    return x >= r.x - PAD && x <= r.x + r.w + PAD && y >= r.y - PAD && y <= r.y + r.h + PAD;
  }

  function handleClick(x, y) {
    var st = G.state;
    if (st === 'setup' || st === 'results' || st === 'gameover') {
      if (inRectPad(x, y, START_BTN)) {
        if (st === 'gameover') resetAll();
        newRound();
        sfxStart();
        return;
      }
      /* Tap back to the setup screen from a finished round (no Esc/R on phones). */
      if ((st === 'results' || st === 'gameover') && inRectPad(x, y, EXIT_BTN)) {
        if (st === 'gameover') resetAll();
        G.state = 'setup';
        sfxBlip();
        return;
      }
      /* The setup screen's N + channel buttons go through the same settings
         functions as the keys and the console API, so all three agree. */
      if (st === 'setup') {
        for (var i = 0; i < N_BTNS.length; i++) {
          if (inRectPad(x, y, N_BTNS[i])) { setN(i + N_MIN); sfxBlip(); return; }
        }
        for (var j = 0; j < CH_BTNS.length; j++) {
          if (inRectPad(x, y, CH_BTNS[j])) { setChannel(j); sfxBlip(); return; }
        }
      }
      return;
    }
    if (st !== 'play') return;
    /* Action bar first: PAUSE has to work while the round is paused. */
    for (var b = 0; b < TBAR.length; b++) {
      if (!inRectPad(x, y, TBAR[b])) continue;
      if (b === 0) togglePause();
      else if (b === 1) G.hint = !G.hint;
      else if (b === 2) SOUND_ON = !SOUND_ON;
      else if (b === 3) setSpeed((G.speed + 1) % SPEEDS.length);
      else G.len = (G.len + 1) % LENGTHS.length;
      sfxBlip();
      return;
    }
    if (G.paused) return;
    if (inRectPad(x, y, BTN.letter)) { pressDim('letter'); return; }
    if (inRectPad(x, y, BTN.pos)) { pressDim('pos'); return; }
    if (inRectPad(x, y, LBOX)) { pressDim('letter'); return; }
    if (x >= GX - PAD && x <= GX + GRID_W + PAD && y >= GY - PAD && y <= GY + GRID_H + PAD) { pressDim('pos'); }
  }

  /* 'Digit3' / 'Numpad3' -> 3, anything else -> -1. */
  function digitOf(code) {
    var m = /^(?:Digit|Numpad)([0-9])$/.exec(code);
    return m ? Number(m[1]) : -1;
  }

  /* Shared picker for the setup + results screens: direct N and channel picks
     (1-4, L/P/B) plus the cycling keys. Returns true when the key was used. */
  function applyChoice(code) {
    var digit = digitOf(code);
    if (digit >= N_MIN && digit <= N_MAX) { setN(digit); sfxBlip(); return true; }
    if (code === 'KeyL') { setChannel('letters'); sfxBlip(); return true; }
    if (code === 'KeyP') { setChannel('positions'); sfxBlip(); return true; }
    if (code === 'KeyB') { setChannel('both'); sfxBlip(); return true; }
    if (code === 'KeyN') { cycleN(); sfxBlip(); return true; }
    if (code === 'KeyM') { cycleMode(); sfxBlip(); return true; }
    if (code === 'KeyS') { setSpeed((G.speed + 1) % SPEEDS.length); sfxBlip(); return true; }
    if (code === 'KeyV') { G.len = (G.len + 1) % LENGTHS.length; sfxBlip(); return true; }
    if (code === 'KeyH') { G.hint = !G.hint; sfxBlip(); return true; }
    if (code === 'KeyT') { SOUND_ON = !SOUND_ON; sfxBlip(); return true; }
    return false;
  }

  function handleKey(code) {
    var st = G.state;
    if (st === 'setup') {
      if (applyChoice(code)) return;
      if (code === 'Space' || code === 'Enter') { newRound(); sfxStart(); }
      return;
    }
    if (st === 'countdown') {
      if (code === 'KeyT') SOUND_ON = !SOUND_ON;
      return;
    }
    if (st === 'play') {
      if (code === 'KeyP') { togglePause(); return; }
      if (code === 'KeyT') { SOUND_ON = !SOUND_ON; return; }
      if (code === 'Escape') { G.state = 'setup'; G.paused = false; return; }
      if (G.paused) return;
      var dim = dimForKey(code);
      if (dim) pressDim(dim);
      return;
    }
    if (st === 'results') {
      if (code === 'Space' || code === 'Enter') { newRound(); sfxStart(); }
      else if (code === 'KeyR') { G.state = 'setup'; }
      else applyChoice(code);   /* re-pick N / channel between rounds */
      return;
    }
    if (st === 'gameover') {
      if (code === 'Space' || code === 'Enter') { resetAll(); newRound(); sfxStart(); }
    }
  }

  function togglePause() {
    var R = G.round;
    if (!R) return;
    if (!G.paused) {
      G.paused = true;
      G.pauseElapsed = NOW() - R.itemStart;
    } else {
      G.paused = false;
      R.itemStart = NOW() - G.pauseElapsed;
    }
  }

  function resetAll() {
    G.score = 0;
    G.lives = 3;
    G.streak = 0;
    G.round = null;
    G.paused = false;
    G.totals = { hit: 0, miss: 0, fa: 0, cr: 0 };
  }

  /* ============================================================
     5. GO
     ============================================================ */
  /* The settings system is also reachable from the page console:
     NBACK.setGameOptions(3, 'both')          N = 3, letters + grid
     NBACK.setGameOptions(2, 'letter')        N = 2, letters only
     NBACK.setGameOptions({ n: 1, channel: 'pos', speed: 'fast', len: 20 })
     NBACK.setN(4) · NBACK.setChannel('both') · NBACK.state()               */
  window.NBACK = {
    setGameOptions: setGameOptions,
    setN: setN,
    setChannel: setChannel,
    setSpeed: setSpeed,
    setLength: setLength,
    setAutoLevel: setAutoLevel,
    cycleN: cycleN,
    cycleMode: cycleMode,
    state: stateSnapshot,
    channelOf: dimsToMode,
    modes: MODES,
    stage: { w: GW, h: GH },
    grid: { x: GX, y: GY, w: GRID_W, h: GRID_H, cw: CELL, ch: CELL },
    matchBtns: BTN,
    letterBox: LBOX,
    optionRects: { n: N_BTNS, ch: CH_BTNS, start: START_BTN, panel: PANEL },
    touch: TOUCH,
    touchRects: { bar: TBAR, exit: EXIT_BTN },
    settings: G
  };

  startGame();

  })();
  </script>
</body>
</html>
